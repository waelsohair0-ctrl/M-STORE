<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>منصة تعليمية</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #6c63ff;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            display: flex;
            padding: 20px;
        }

        .video-player {
            flex: 2;
            margin-right: 20px;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        .video-list {
            flex: 1;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        .video-item {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .video-item:hover {
            background-color: #eee;
        }
    </style>
</head>
<body>

<header>
    <h1>📚 منصتي التعليمية</h1>
</header>
<div class="container">
    <div class="video-player">
            <iframe id="mainVideo" width="100%" height="450" 
                src="https://www.youtube.com/embed/fT2_YV_T_mE" 
                frameborder="0" allowfullscreen>
            </iframe>
    </div>
    <div class="video-list">
        <div class="video-item" onclick="changeVideo('https://www.youtube.com/embed/fT2_YV_T_mE')">الدرس الأول</div>
        <div class="video-item" onclick="changeVideo('https://www.youtube.com/embed/ID_C3axGF8Ww-2tGsNe')">الدرس الثاني</div>
        <div class="video-item" onclick="changeVideo('https://www.youtube.com/embed/ID_C3axGF8Ww-2tGsNe')">الدرس الثالث</div>
    </div>

</div> </div> <script>
    function changeVideo(videoSrc) {
        var video = document.getElementById("mainVideo");
        video.src = videoSrc;
    }
</script>

</body>
</html>
